<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Bestellsystem</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .bereich {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .gericht {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .hinzufuegen {
            background: #4CAF50;
            color: white;
        }

        .plusminus {
            background: #ddd;
            margin: 0 3px;
        }

        .bestellung {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .absenden {
            width: 100%;
            padding: 15px;
            background: #2196F3;
            color: white;
            font-size: 18px;
            margin-top: 10px;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <h1>🍕 Restaurant Bestellsystem</h1>

    <div class="bereich">
        <label for="tisch"><strong>Tisch auswählen:</strong></label>

        <select id="tisch">
            <option value="1">Tisch 1</option>
            <option value="2">Tisch 2</option>
            <option value="3">Tisch 3</option>
            <option value="4">Tisch 4</option>
            <option value="5">Tisch 5</option>
            <option value="6">Tisch 6</option>
        </select>
    </div>


    <div class="bereich">

        <h2>Speisekarte</h2>

        <div class="gericht">
            <span>Pizza Margherita – 9,50 €</span>
            <button class="hinzufuegen"
                onclick="hinzufuegen('Pizza Margherita', 9.50)">
                Hinzufügen
            </button>
        </div>

        <div class="gericht">
            <span>Pizza Salami – 10,50 €</span>
            <button class="hinzufuegen"
                onclick="hinzufuegen('Pizza Salami', 10.50)">
                Hinzufügen
            </button>
        </div>

        <div class="gericht">
            <span>Spaghetti Bolognese – 11,50 €</span>
            <button class="hinzufuegen"
                onclick="hinzufuegen('Spaghetti Bolognese', 11.50)">
                Hinzufügen
            </button>
        </div>

        <div class="gericht">
            <span>Cola – 3,00 €</span>
            <button class="hinzufuegen"
                onclick="hinzufuegen('Cola', 3.00)">
                Hinzufügen
            </button>
        </div>

    </div>


    <div class="bereich">

        <h2>Aktuelle Bestellung</h2>

        <div id="bestellung">
            Noch keine Artikel ausgewählt.
        </div>

        <h3>
            Gesamt: <span id="gesamt">0.00</span> €
        </h3>

        <button class="absenden" onclick="bestellungAbsenden()">
            Bestellung absenden
        </button>

        <div id="status"></div>

    </div>


<script>

// ==================================================
// SUPABASE EINSTELLUNGEN
// ==================================================

// HIER deine Supabase Project URL eintragen
const SUPABASE_URL = "https://vnvvivgdctdesvwnxlcj.supabase.co";

// HIER deinen Publishable Key eintragen
const SUPABASE_KEY = "sb_publishable_eKTZAEO03kD6EcMR6zckgg_lJ1gBCOy";


// Supabase Verbindung herstellen
let supabaseClient = null;

try {

    if (
        SUPABASE_URL !== "DEINE_SUPABASE_URL" &&
        SUPABASE_KEY !== "DEIN_PUBLISHABLE_KEY"
    ) {

        supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        console.log("Supabase wurde erfolgreich gestartet.");

    } else {

        console.log("Supabase-Daten wurden noch nicht eingetragen.");

    }

} catch (fehler) {

    console.error("Supabase Fehler:", fehler);

}


// ==================================================
// BESTELLUNG
// ==================================================

let bestellung = [];


// Artikel hinzufügen
function hinzufuegen(name, preis) {

    const vorhandenerArtikel = bestellung.find(
        artikel => artikel.name === name
    );

    if (vorhandenerArtikel) {

        vorhandenerArtikel.menge++;

    } else {

        bestellung.push({
            name: name,
            preis: preis,
            menge: 1
        });

    }

    anzeigen();
}


// Menge erhöhen
function plus(index) {

    bestellung[index].menge++;

    anzeigen();
}


// Menge verringern
function minus(index) {

    bestellung[index].menge--;

    if (bestellung[index].menge <= 0) {

        bestellung.splice(index, 1);

    }

    anzeigen();
}


// Bestellung anzeigen
function anzeigen() {

    const container = document.getElementById("bestellung");

    container.innerHTML = "";

    if (bestellung.length === 0) {

        container.innerHTML = "Noch keine Artikel ausgewählt.";

        document.getElementById("gesamt").textContent = "0.00";

        return;
    }


    let gesamt = 0;


    bestellung.forEach((artikel, index) => {

        const zeile = document.createElement("div");

        zeile.className = "bestellung";


        const einzelpreis =
            artikel.preis * artikel.menge;

        gesamt += einzelpreis;


        zeile.innerHTML = `
            <span>
                ${artikel.name}
                (${artikel.preis.toFixed(2)} €)
            </span>

            <span>

                <button class="plusminus"
                    onclick="minus(${index})">
                    −
                </button>

                ${artikel.menge}

                <button class="plusminus"
                    onclick="plus(${index})">
                    +
                </button>

            </span>
        `;


        container.appendChild(zeile);

    });


    document.getElementById("gesamt").textContent =
        gesamt.toFixed(2);

}


// ==================================================
// BESTELLUNG AN SUPABASE SENDEN
// ==================================================

async function bestellungAbsenden() {

    const status = document.getElementById("status");


    // Prüfen, ob Artikel vorhanden sind
    if (bestellung.length === 0) {

        alert("Bitte zuerst mindestens einen Artikel auswählen.");

        return;
    }


    // Tisch auslesen
    const tisch =
        parseInt(document.getElementById("tisch").value);


    // Prüfen, ob Supabase eingerichtet ist
    if (!supabaseClient) {

        status.innerHTML =
            "❌ Supabase ist noch nicht eingerichtet.";

        status.style.background = "#ffdddd";

        return;
    }


    status.innerHTML = "⏳ Bestellung wird gespeichert...";
    status.style.background = "#fff3cd";


    try {

        // Für jeden Artikel einen Datensatz erstellen
        const daten = bestellung.map(artikel => ({

            tisch: tisch,

            artikel: artikel.name,

            menge: artikel.menge,

            preis: artikel.preis

        }));


        // Daten an Supabase senden
        const { data, error } =
            await supabaseClient
                .from("Bestellungen")
                .insert(daten);


        // Fehler überprüfen
        if (error) {

            console.error("Supabase Fehler:", error);

            status.innerHTML =
                "❌ Fehler beim Speichern: " +
                error.message;

            status.style.background = "#ffdddd";

            return;
        }


        // Erfolg
        status.innerHTML =
            "✅ Bestellung wurde erfolgreich gespeichert!";

        status.style.background = "#ddffdd";


        // Bestellung leeren
        bestellung = [];

        anzeigen();


    } catch (fehler) {

        console.error("Fehler:", fehler);

        status.innerHTML =
            "❌ Es ist ein Fehler aufgetreten.";

        status.style.background = "#ffdddd";

    }

}


// Startanzeige
anzeigen();

</script>

</body>
</html>
